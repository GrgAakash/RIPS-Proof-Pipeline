name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[pipeline]'

      - name: Check generated prompt views
        run: python -B prompt_sync.py --check

      - name: Run offline regression suite
        env:
          PYTHONPATH: Individual Pipeline
        run: python -B -m unittest discover -s tests -p 'test*.py'
