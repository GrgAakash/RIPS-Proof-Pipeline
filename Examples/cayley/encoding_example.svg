<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" role="img" aria-labelledby="title desc">
  <title id="title">A leaf-removal code on four vertices</title>
  <desc id="desc">The function has f(1)=1, f(2)=3, f(3)=1 and f(4)=3. With root 1 fixed, remove the least non-root leaf 2 and record 3, then remove leaf 4 and record 3. The code is (3,3); the remaining assignments are f(3)=1 and f(1)=1.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size:22px; fill:#17233c; }
      .bg { fill:#fff; } .heading { font-size:25px; font-weight:700; }
      .node { fill:#eaf2ff; stroke:#3976c5; stroke-width:2; }
      .root { fill:#18856f; stroke:#18856f; } .root-label { fill:#fff; }
      .edge { fill:none; stroke:#53627a; stroke-width:2.4; marker-end:url(#arrow); }
      .arrow { fill:#53627a; } .card { fill:#f3f6fa; }
      .note { fill:#53627a; font-size:18px; } .label { font-weight:600; }
      @media (prefers-color-scheme: dark) {
        .bg { fill:#0d1117; } text { fill:#f0f6fc; }
        .node { fill:#1a2a42; stroke:#7baded; }
        .root { fill:#55c2a2; stroke:#55c2a2; } .root-label { fill:#0d1117; }
        .edge { stroke:#b3c0d1; } .arrow { fill:#b3c0d1; }
        .card { fill:#192331; } .note { fill:#b3c0d1; }
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" class="arrow"/>
    </marker>
  </defs>
  <rect width="640" height="330" rx="12" class="bg"/>
  <text x="28" y="37" class="heading">One encoding: n = 4, root = 1</text>
  <path d="M74 87C29 35 159 35 116 87" class="edge"/>
  <path d="M95 166V127" class="edge"/>
  <path d="M60 239L79 211" class="edge"/>
  <path d="M130 239L111 211" class="edge"/>
  <circle cx="95" cy="102" r="24" class="node root"/>
  <circle cx="95" cy="191" r="24" class="node"/>
  <circle cx="45" cy="259" r="24" class="node"/>
  <circle cx="145" cy="259" r="24" class="node"/>
  <g text-anchor="middle" class="label">
    <text x="95" y="110" class="root-label">1</text>
    <text x="95" y="199">3</text>
    <text x="45" y="267">2</text>
    <text x="145" y="267">4</text>
  </g>
  <text x="95" y="312" text-anchor="middle" class="note">Arrows show f</text>
  <rect x="220" y="78" width="392" height="65" rx="9" class="card"/>
  <text x="240" y="106" class="label">Remove leaf 2; record 3</text>
  <text x="240" y="131" class="note">2 is the least eligible leaf.</text>
  <rect x="220" y="158" width="392" height="65" rx="9" class="card"/>
  <text x="240" y="186" class="label">Remove leaf 4; record 3</text>
  <text x="240" y="211" class="note">The root is never removed.</text>
  <text x="240" y="266" class="heading">Code: (3, 3)</text>
  <text x="240" y="295" class="note">Finish with f(3) = 1 and f(1) = 1.</text>
</svg>
