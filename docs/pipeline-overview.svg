<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">RIPS Proof Pipeline overview</title>
  <desc id="desc">Paper Cleaner prepares the whole paper and selects a target. Paper Cleaner Mini builds an audited target-scoped packet, which passes through S0-S6 proof reconstruction and evidence gates. An optional private final checker uses isolated gold material after the public verifier cascade.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#f7f5ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17233c" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#53627a"/>
    </marker>
    <style>
      .title { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17233c; }
      .subtitle { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #60708a; }
      .node-title { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17233c; }
      .node-copy { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #53627a; }
      .number { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .lane { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.2px; fill: #60708a; }
      .private-title { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #7c2d3c; }
      .private-copy { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #77545b; }
      .arrow { stroke: #53627a; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="458" rx="24" fill="url(#bg)" stroke="#dce4f0"/>
  <text class="title" x="56" y="52">From paper to auditable proof package</text>
  <text class="subtitle" x="56" y="78">Exact targets, explicit evidence gates, and a visible boundary around privileged reference material</text>
  <text class="lane" x="56" y="121">TARGET PREPARATION, SOLVING, AND EVIDENCE</text>
  <path class="arrow" d="M244 224 H276"/>
  <path class="arrow" d="M464 224 H496"/>
  <path class="arrow" d="M704 224 H736"/>
  <path class="arrow" d="M924 224 H956"/>
  <g filter="url(#shadow)">
    <rect x="56" y="145" width="188" height="158" rx="18" fill="#ffffff" stroke="#aac7ee" stroke-width="2"/>
    <circle cx="85" cy="174" r="15" fill="#3976c5"/><text class="number" x="81" y="179">1</text>
    <text class="node-title" x="78" y="215">Paper Cleaner</text>
    <text class="node-copy" x="78" y="241">Fetch and index</text><text class="node-copy" x="78" y="261">the whole paper</text><text class="node-copy" x="78" y="281">select a target</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="276" y="145" width="188" height="158" rx="18" fill="#ffffff" stroke="#b6a8e8" stroke-width="2"/>
    <circle cx="305" cy="174" r="15" fill="#7357bd"/><text class="number" x="301" y="179">2</text>
    <text class="node-title" x="298" y="215">Cleaner Mini</text>
    <text class="node-copy" x="298" y="241">Build and audit</text><text class="node-copy" x="298" y="261">the target-scoped</text><text class="node-copy" x="298" y="281">solver packet</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="496" y="145" width="208" height="158" rx="18" fill="#ffffff" stroke="#a899e5" stroke-width="2"/>
    <circle cx="525" cy="174" r="15" fill="#674bb5"/><text class="number" x="521" y="179">3</text>
    <text class="node-title" x="518" y="215">S0-S6 reconstruction</text>
    <text class="node-copy" x="518" y="241">Plan → specialists</text><text class="node-copy" x="518" y="261">→ composition</text><text class="node-copy" x="518" y="281">→ candidate proof</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="736" y="145" width="188" height="158" rx="18" fill="#ffffff" stroke="#e6bc73" stroke-width="2"/>
    <circle cx="765" cy="174" r="15" fill="#c8831d"/><text class="number" x="761" y="179">4</text>
    <text class="node-title" x="758" y="215">Evidence gates</text>
    <text class="node-copy" x="758" y="241">Target · citations</text><text class="node-copy" x="758" y="261">A1/A2/A3 · B · C</text><text class="node-copy" x="758" y="281">controller routing</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="956" y="145" width="188" height="158" rx="18" fill="#ffffff" stroke="#8fcaa9" stroke-width="2"/>
    <circle cx="985" cy="174" r="15" fill="#32855b"/><text class="number" x="981" y="179">5</text>
    <text class="node-title" x="978" y="215">Proof package</text>
    <text class="node-copy" x="978" y="241">Reader proof</text><text class="node-copy" x="978" y="261">source ledger</text><text class="node-copy" x="978" y="281">terminal status</text>
  </g>
  <rect x="496" y="344" width="428" height="76" rx="16" fill="#fff7f7" stroke="#d996a3" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="private-title" x="518" y="374">Optional private final check</text>
  <text class="private-copy" x="518" y="397">Gold proof + full source remain isolated from S0-S6 and the public verifier cascade.</text>
  <path d="M830 303 V330 Q830 344 816 344" stroke="#b75b6b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M924 382 H1042 Q1054 382 1054 368 V319" stroke="#b75b6b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
</svg>
